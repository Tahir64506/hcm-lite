<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HCM Lite{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  {% if user.is_authenticated %}
  <nav class="navbar navbar-expand bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">HCM Lite</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-white-50 small">{{ user.first_name|default:user.email }}</span>
        <span class="badge text-bg-info text-uppercase">{{ user.role }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
        </form>
      </div>
    </div>
  </nav>
  {% endif %}
  <div class="container py-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
